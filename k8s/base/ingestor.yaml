apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: log-platform
  labels:
    app: ingestor
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ingestor
  template:
    metadata:
      labels:
        app: ingestor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ingestor
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ingestor
          image: ghcr.io/vamsi-arumalla/log-platform-ingestor:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BROKERS
              value: kafka-0.kafka-headless.log-platform.svc:9092,kafka-1.kafka-headless.log-platform.svc:9092,kafka-2.kafka-headless.log-platform.svc:9092
            - name: KAFKA_PARTITIONS
              value: "12"
            - name: KAFKA_REPLICATION
              value: "3"
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: endpoint
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor
  namespace: log-platform
spec:
  selector:
    app: ingestor
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestor-pdb
  namespace: log-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ingestor
