apiVersion: apps/v1
kind: Deployment
metadata:
  name: query
  namespace: log-platform
  labels:
    app: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: query
                topologyKey: kubernetes.io/hostname
      containers:
        - name: query
          image: ghcr.io/vamsi-arumalla/log-platform-query:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: KAFKA_BROKERS
              value: kafka-0.kafka-headless.log-platform.svc:9092,kafka-1.kafka-headless.log-platform.svc:9092,kafka-2.kafka-headless.log-platform.svc:9092
            - name: KAFKA_CONSUMER_GROUP
              value: log-processors
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: endpoint
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: query
  namespace: log-platform
spec:
  selector:
    app: query
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: query-pdb
  namespace: log-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: query
